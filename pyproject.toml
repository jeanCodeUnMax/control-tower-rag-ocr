[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "control-tower-rag"
version = "0.5.0"
description = "Tour de contrôle modulaire pour ingestion, OCR, RAG, policies et raisonnement."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Jean-Sébastien"}]
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7",
  "typer>=0.12,<1",
  "uvicorn>=0.30,<1",
  "PyMuPDF>=1.24,<2",
  "Pillow>=10,<13",
  "pytesseract>=0.3.13,<1",
  "duckduckgo-search>=6,<7",
  "pdfplumber>=0.11,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.6,<1"]
vision = ["openai>=1.75,<3"]

[project.scripts]
control-tower = "control_tower.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
